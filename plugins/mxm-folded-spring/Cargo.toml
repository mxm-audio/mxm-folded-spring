[package]
name = "mxm-folded-spring"
description = "The Roland System-100 103 mixer's spring reverb as a standalone effect, with the tank as a control: level and three tanks"
version.workspace = true
edition.workspace = true
# The editor pulls in egui, which declares 1.95. `mxm-mono-00-dsp`, which this plugin depends on in
# place rather than copying, stays lower and must not be dragged up with it - the effect depends on
# the DSP, never the reverse.
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# `lib` as well as `cdylib`: the shipped artifact is the `cdylib`. The `lib` is what lets a test or
# a standalone harness link the plugin. **Do not enable nice-plug's `standalone` feature here** -
# it pulls in cpal and JACK, and Cargo's feature unification would put them in the shipped `.clap`.
crate-type = ["cdylib", "lib"]

[dependencies]
nice-plug.workspace = true
nice-plug-egui.workspace = true
mxm-ui.workspace = true
# Presets: the format, the library on disk, favourites, the loaded identity and the app-bar
# controls, one crate for every instrument and effect.
mxm-preset.workspace = true
egui.workspace = true
# The tank itself. A compile-time dependency on the instrument's DSP crate, not a copy of it: one
# implementation, and the instrument's render provably unchanged (see that crate's
# `tests/spring_tanks.rs`). Linking discards the voice this plugin never calls.
mxm-mono-00-dsp.workspace = true

[dev-dependencies]
# The collection's shared headless checks (`crates/mxm-plugin-test`).
mxm-plugin-test.workspace = true
# `wgpu` renders a frame to pixels for the layout-tree review pictures
# (`mxm_plugin_test::tree_checks`, `editor::tests::tree_pictures`). Test-only: nothing here reaches
# the bundle.
egui_kittest = { version = "=0.36.1", features = ["wgpu"] }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
